<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escape Room · Board</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="escape.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
  header h1 { margin: 0; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  header .bay { color: var(--ink-2); font-size: 18px; }
  header .sp { flex: 1; }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--line); background: var(--panel); display: grid; place-items: center; cursor: pointer; padding: 0; }
  main { display: grid; grid-template-columns: 1fr 330px; min-height: 0; }
  #stage { padding: 18px 22px; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
  aside { border-left: 1px solid var(--line); padding: 16px; display: flex; flex-direction: column; gap: 14px; overflow: auto; background: var(--bg-2); }
  aside h3 { margin: 0; font-size: 17px; display: flex; align-items: center; gap: 8px; }
  .lockrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .lockrow span { display: flex; align-items: center; gap: 4px; padding: 4px 8px 4px 4px; border-radius: 999px; background: var(--panel); border: 2px solid var(--lc); font-size: 13px; }
  .lockrow span.open { opacity: .55; }
  .goals { display: flex; flex-direction: column; gap: 6px; font-size: 15px; }
  .goals div { display: flex; align-items: center; gap: 8px; }
  .goals div.lost { opacity: .45; text-decoration: line-through; }
  .hintlist { display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.35; }
  .hintlist div { padding: 8px 10px; background: var(--panel); border-radius: 10px; border-left: 4px solid var(--lc); }
  .hintlist b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); }
  .hintlist .give b { color: var(--bad); }
  .log { display: flex; flex-direction: column; gap: 6px; font-size: 14px; color: var(--ink-2); line-height: 1.4; }
  .log .ok { color: var(--good); }
  .log .tk { font-size: 15px; min-width: 0; margin: 0 1px; }
  .log .tk svg { vertical-align: -5px; }
  .log .sw i { width: 14px; height: 14px; } .log .sw small { display: none; }
  .settings { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 10, 20, .82); z-index: 10; padding: 24px; }
  .card { max-width: 680px; text-align: center; padding: 30px 36px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 24px; }
  .card h2 { font-size: 40px; margin: 0 0 6px; }
  .card p { font-size: 19px; color: var(--ink-2); }
  .card .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
  .card.wide { max-width: 980px; }
</style>
</head>
<body>
<header>
  <h1><span id="logo"></span> Split-Vision Escape</h1>
  <span class="bay" id="bay"></span>
  <span class="sp"></span>
  <span class="chip" id="net"><span class="dot"></span><span>connecting</span></span>
  <span class="chip" id="room"></span>
  <button class="icon-btn" id="sound" aria-label="Sound on or off"></button>
</header>
<main>
  <div id="stage"></div>
  <aside>
    <div><h3>Locks</h3><div class="lockrow" id="progress" style="margin-top:8px"></div></div>
    <div><h3 id="goalsH">Stars</h3><div class="goals" id="goals" style="margin-top:8px"></div></div>
    <div id="hintbox" class="hidden"><h3 id="hintsH">Hints</h3><div class="hintlist" id="hints" style="margin-top:8px"></div></div>
    <div><h3>What happened</h3><div class="log" id="log" style="margin-top:8px"></div></div>
    <div class="settings">
      <button class="btn sm" id="howto">How to play</button>
      <button class="btn sm" id="swap">Swap roles</button>
      <button class="btn sm" id="restart">Restart room</button>
      <button class="btn sm" id="rooms">Rooms</button>
      <button class="btn sm" id="seats">Show join code</button>
    </div>
  </aside>
</main>
<div class="overlay hidden" id="lobby"></div>
<div class="overlay hidden" id="card"></div>

<script type="module">
import { hostRoom, load, save } from '../shared/net.js';
import { renderLobby, findLan } from '../shared/lobby.js';
import { showHelp, helpOnce } from '../shared/help.js';
import { burst, shake } from '../shared/art.js';
import { sfx, isMuted, setMuted } from '../shared/sfx.js';
import { ROOMS, STORY } from './rooms.js';
import { newRoom, tryLock, hint, viewFor, roomDone, visible, isSolved, finalReady, lockColor, HINT_TIERS, hintsUsed, starsFor, STAR_RULES } from './game.js';
import { token, esc } from './cards.js';
import { art, sceneSvg, SCENES } from './art.js';

const $ = id => document.getElementById(id);
const SEATS = {
  sun: { label: 'Sun', icon: art('sun', { size: 30 }), blurb: 'sees the room by daylight: half the clues' },
  moon: { label: 'Moon', icon: art('moon', { size: 30 }), blurb: 'sees the room by lamplight: the other half' },
};
const SEAT_IDS = Object.keys(SEATS);

const room = hostRoom({ game: 'escape', seats: SEAT_IDS, onSeats: render, onAction, onStatus });
const KEY = `coop-escape-${room.room}`;
// the save: which room, which locks are open, which hints are showing, the best result per room
const fresh = () => ({ v: 2, level: 0, unlocked: 0, st: newRoom(), log: [], lobby: true, started: false, last: null, n: 0, results: {} });
let S = load(KEY);
if (!S || S.v !== 2) S = fresh();
const persist = () => save(KEY, S);
const R = () => ROOMS[S.level];
// not saved: who is typing on which lock, and the tumbler animation each lock is showing
const typing = {}; // `${lock}:${seat}` -> how many symbols typed so far (never what)
const fx = {}; // lock -> {mode: 'miss'|'hit'|'half', close, seat, until}
let escapeAt = 0; // when the exit door started to open: the escaped card waits for it (Infinity: about to)
const animating = new Set(); // locks just opened whose tumblers are still clicking home: drawn as closed until then
const shownOpen = l => isSolved(l, S.st) && !animating.has(l.id);

$('room').textContent = 'Room ' + room.room;
$('logo').innerHTML = art('obj-padlock', { size: 30 });
const soundBtn = () => { $('sound').innerHTML = art(isMuted() ? 'mute' : 'sound', { size: 24 }); };
soundBtn();
await findLan();

const HOWTO = {
  icon: art('obj-padlock', { size: 34 }), title: 'How to play', intro: STORY.intro,
  sections: [
    { h: 'The idea', items: ['Each phone shows a <b>different half</b> of every clue. Nobody can open anything alone.', 'Describe what you see, out loud, in order. Your partner cross-references it with theirs.'] },
    { h: 'Each room', items: ['Every lock stands in the room on the TV. Its clues on both phones wear its colour.', 'Either of you can type an answer. The tumblers on the TV light up for each symbol that was right.', 'The last lock appears when the others open: you each enter what your <b>partner’s</b> phone shows.'] },
    { h: 'Stars', items: STAR_RULES.map((r, i) => `${art('star', { size: 18 })} ${r}`).concat(['There is no timer. Every escaped room is a good place to stop.']) },
    { h: 'Hints', items: [`${art('bulb', { size: 18 })} Tap a lock’s bulb on the TV: a nudge first, then how to, then the give-away (which costs a star).`] },
  ],
};

function onStatus(st) {
  $('net').innerHTML = `<span class="dot${st === 'open' ? ' on' : ''}"></span><span>${st === 'open' ? (room.net === 'local' ? 'local tabs' : 'online') : st}</span>`;
}

const nameOf = seat => `${art(seat, { size: 18 })} ${esc(room.seat(seat)?.name || SEATS[seat].label)}`;
const bothSeated = () => SEAT_IDS.every(s => room.seat(s));

function enter(level) {
  S.level = level; S.st = newRoom(); S.lobby = false; S.started = true; S.last = null; escapeAt = 0;
  for (const k in typing) delete typing[k];
  for (const k in fx) delete fx[k];
  S.log = [`Room ${level + 1}: ${esc(ROOMS[level].name)}.`];
  persist(); stageKey = ''; render();
  helpOnce('escape-board', HOWTO);
}

function onAction(seat, a) {
  if (!a || typeof a !== 'object') return;
  if (a.a === 'start' && S.lobby && bothSeated()) { if (S.started) { S.lobby = false; persist(); return render(); } return enter(0); }
  if (S.lobby) return;
  const done = roomDone(R(), S.st);
  if (a.a === 'next' && done) return enter(Math.min(S.level + 1, ROOMS.length - 1));
  if (a.a === 'replay' && done) return enter(S.level);
  if (a.a === 'hint' && !done) { S.st = hint(R(), S.st, a.lock); sfx.chime(); persist(); return render(); }
  if (a.a === 'typing' && seat && !done) {
    const n = Math.max(0, Math.min(8, a.n | 0)), k = `${a.lock}:${seat}`;
    if ((typing[k] || 0) < n) sfx.tick();
    typing[k] = n; updatePlates(); return;
  }
  if (a.a === 'try' && seat && !done) {
    const lock = R().locks.find(l => l.id === a.lock);
    if (!lock) return;
    const r = tryLock(R(), S.st, a.lock, seat, a.value);
    if (r.st === S.st) return; // not a lock this seat can try right now
    S.st = r.st; S.n++; typing[`${lock.id}:${seat}`] = 0;
    S.last = { n: S.n, seat, lock: lock.id, ok: r.ok, opened: r.opened, close: r.close };
    const what = (a.value || []).map(t => token(lock.input.type, t)).join(' ');
    const title = esc(lock.title.toLowerCase());
    S.log.unshift(r.opened ? `<span class="ok">${nameOf(seat)} opened the ${title}!</span>`
      : r.ok ? `<span class="ok">${nameOf(seat)}’s half of the ${title} clicks into place.</span>`
      : `${nameOf(seat)} tried ${what} on the ${title}.${r.close != null ? ` ${r.close} of ${lock.input.len} right.` : ''}`);
    if (r.opened) animating.add(lock.id);
    if (roomDone(R(), S.st)) {
      escapeAt = Infinity;
      S.unlocked = Math.max(S.unlocked, Math.min(S.level + 1, ROOMS.length - 1));
      const was = S.results[S.level], now = { hints: hintsUsed(S.st), tries: S.st.tries || 0, stars: starsFor(R(), S.st).stars };
      S.results[S.level] = !was || now.stars > (was.stars || 0) || (now.stars === (was.stars || 0) && now.hints < was.hints) ? now : was;
      S.log.unshift('<span class="ok">The way out is open!</span>');
    }
    S.log = S.log.slice(0, 30);
    persist(); render();
    play(lock, seat, r);
  }
}

// --- the TV's reactions ------------------------------------------------------------------------------------------
const wait = ms => new Promise(res => setTimeout(res, ms));
const objEl = id => document.querySelector(`.obj[data-lock="${id}"]`);

async function play(lock, seat, r) {
  const el = objEl(lock.id), len = lock.input.len || (lock.input.type === 'coord' ? 2 : 1);
  if (!r.ok) {
    fx[lock.id] = { mode: 'miss', close: r.close ?? 0, until: Date.now() + 1800 };
    updatePlates(); sfx.lock();
    await wait(240); sfx.bad();
    if (el) { shake(el.querySelector('.obj-art')); shake(el.querySelector('.plate')); }
    await wait(1600); updatePlates();
    return;
  }
  if (lock.final && !r.opened) {
    fx[lock.id] = { mode: 'half', seat, until: Date.now() + 1200 };
    updatePlates(); sfx.good(); if (el) burst(el.querySelector('.plate'), { count: 6, spread: 60, size: 16 });
    return;
  }
  // opened: tumblers click home one by one, the badge drops, the object glows
  fx[lock.id] = { mode: 'hit', until: Date.now() + 400 + len * 120 };
  for (let i = 0; i < len; i++) { updatePlates(i + 1); sfx.tick(); await wait(120); }
  sfx.great();
  animating.delete(lock.id); stageKey = ''; render();
  const now = objEl(lock.id);
  if (now) { now.classList.add('unlocking'); burst(now.querySelector('.obj-art'), { count: 18, spread: 140, size: 22 }); }
  banner(`${esc(lock.title)} open!`, lock.final ? 'You opened it together.' : `${nameOf(seat)} turned it.`);
  if (roomDone(R(), S.st)) {
    await wait(900);
    escapeAt = Date.now(); stageKey = [S.level, ...visible(R(), S.st).map(l => l.id + '+'), true].join('|');
    const exit = document.querySelector('.exit');
    if (exit) { exit.classList.add('opened'); exit.closest('.scene').classList.add('escaped'); sfx.whoosh(); }
    await wait(500);
    sfx.win();
    if (exit) { burst(exit, { count: 30, spread: 220, size: 26 }); burst(exit, { count: 10, sprite: 'star', spread: 160, size: 24 }); }
    await wait(2450);
    render();
  }
}

function banner(title, sub) {
  const b = document.createElement('div');
  b.className = 'banner';
  b.innerHTML = `${art('unlock', { size: 40 })}<div><b>${title}</b><small>${sub}</small></div>`;
  document.querySelector('.scene')?.appendChild(b);
  setTimeout(() => b.remove(), 2400);
}

// --- drawing -----------------------------------------------------------------------------------------------------
let stageKey = '';

// The tumblers under a lock: one pip per symbol. Typing fills them softly; a miss lights as many as were right
// (left to right, so it says how many, never which); an opened lock fills them all.
function pips(lock, seat, clickedHome) {
  const len = lock.input.len || (lock.input.type === 'coord' ? 2 : 1), f = fx[lock.id], live = f && f.until > Date.now();
  const typed = seat ? typing[`${lock.id}:${seat}`] || 0 : Math.max(...SEAT_IDS.map(s => typing[`${lock.id}:${s}`] || 0));
  return Array.from({ length: len }, (_, i) => {
    let c = i < typed ? 'typed' : '';
    if (live && f.mode === 'miss') c = i < f.close ? 'right' : 'wrong';
    if (live && f.mode === 'hit') c = i < (clickedHome ?? len) ? 'home' : '';
    return `<i class="${c}"></i>`;
  }).join('');
}

function plateInner(l, clickedHome) {
  const st = S.st, open = shownOpen(l), n = st.hints[l.id] || 0, next = HINT_TIERS[n];
  const bulb = !open && n < l.hints.length
    ? `<button class="bulb${n === l.hints.length - 1 ? ' give' : ''}" data-act="hint:${l.id}" title="${esc(next || 'Hint')}">${art('bulb', { size: 26 })}</button>` : '';
  if (l.final) {
    const rows = SEAT_IDS.map(s => {
      const inn = st.solved[l.id]?.[s];
      return `<div class="half${inn ? ' in' : ''}">${art(s, { size: 22 })}<span class="pips">${inn ? '' : pips(l, s, clickedHome)}</span>${inn ? art('check', { size: 20 }) : ''}</div>`;
    }).join('');
    return `<b>${esc(l.title)}</b>${open ? '' : rows}${open ? '<div class="state">Open</div>' : '<div class="state">Each enters the partner’s half</div>'}${bulb}`;
  }
  return `<b>${esc(l.title)}</b>${open ? '<div class="state">Open</div>' : `<span class="pips">${pips(l, null, clickedHome)}</span>`}${bulb}`;
}

function objHtml(l) {
  const sp = SCENES[R().scene].spots[l.id], open = shownOpen(l);
  return `<div class="obj${open ? ' open' : ''}${l.final ? ' final' : ''}" data-lock="${l.id}" style="left:${sp.x}%;top:${sp.y}%;--s:${sp.s};--lc:${lockColor(R(), l)}">
    <div class="obj-art">${art(l.icon, { size: 100, label: l.title })}<span class="badge">${art(open ? 'unlock' : 'lock', { size: 40 })}</span></div>
    <div class="plate">${plateInner(l)}</div>
  </div>`;
}

function mysteryHtml(l) {
  const sp = SCENES[R().scene].spots[l.id];
  return `<div class="obj mystery" style="left:${sp.x}%;top:${sp.y}%;--s:${sp.s};--lc:var(--line)">
    <div class="obj-art">${art(l.icon, { size: 100 })}<span class="badge">${art('question', { size: 40 })}</span></div>
    <div class="plate"><b>The way out</b><div class="state">Appears when the others open</div></div></div>`;
}

function stageHtml() {
  const r = R(), st = S.st, sc = SCENES[r.scene], done = roomDone(r, st);
  const hidden = r.locks.filter(l => l.final && !finalReady(r, st));
  return `
    <div class="scene${done && escapeAt !== Infinity ? ' escaped' : ''}" style="--door:${['#9a6436', '#6b4a33', '#5a8a6a', '#6b4a6e', '#3b4a7a', '#7d1a2a', '#5d6a80'][S.level % 7]}">
      ${sceneSvg(r.scene)}
 <div class="exit${done && escapeAt !== Infinity ? ' opened' : ''}" style="left:${sc.exit.x}%;top:${sc.exit.y}%;--s:${sc.exit.s}">
        ${art('exit-frame', { size: 100 })}<div class="panel">${art('exit-panel', { size: 100 })}</div>
      </div>
      ${visible(r, st).map(objHtml).join('')}${hidden.map(mysteryHtml).join('')}
      ${r.tutorial ? '<span class="tag">Practice room</span>' : r.finale ? '<span class="tag">Finale</span>' : ''}
    </div>
    <div class="narration">${art('journal', { size: 40 })}<div><h2>${esc(r.name)}</h2><p>${esc(r.intro)}</p></div></div>
    <div class="trail">${ROOMS.map((x, i) => {
      const res = S.results[i], stars = res?.stars ?? (res ? 1 : 0), ahead = i > S.unlocked;
      return `<div class="pc${i === S.level ? ' here' : ''}${ahead ? ' ahead' : ''}"><div class="thumb">${sceneSvg(x.scene)}${ahead ? `<span class="lk">${art('lock', { size: 22 })}</span>` : ''}</div>
        <div class="cap2"><b>${i + 1}. ${esc(x.name.replace(/^The /, ''))}</b><span>${[0, 1, 2].map(k => art(k < stars ? 'star' : 'star-empty', { size: 12 })).join('')}</span></div></div>`;
    }).join('')}</div>`;
}

function updatePlates(clickedHome) {
  for (const l of visible(R(), S.st)) {
    const el = objEl(l.id)?.querySelector('.plate');
    const f = fx[l.id];
    if (el) el.innerHTML = plateInner(l, f && f.mode === 'hit' ? clickedHome : undefined);
  }
}

function render() {
  const r = R(), st = S.st, done = roomDone(r, st);
  $('bay').textContent = `Room ${S.level + 1} of ${ROOMS.length}: ${r.name}`;
  const key = [S.level, ...visible(r, st).map(l => l.id + (shownOpen(l) ? '+' : '-')), done && escapeAt !== Infinity].join('|');
  if (key !== stageKey) { stageKey = key; $('stage').innerHTML = stageHtml(); }
  else updatePlates();

  $('progress').innerHTML = r.locks.map(l => {
    const open = shownOpen(l), seen = !l.final || finalReady(r, st);
    return `<span class="${open ? 'open' : ''}" style="--lc:${seen ? lockColor(r, l) : 'var(--line)'}">${art(open ? 'unlock' : seen ? 'lock' : 'question', { size: 20 })}${seen ? esc(l.title) : 'The way out'}</span>`;
  }).join('');
  const s = starsFor(r, st);
  $('goals').innerHTML = STAR_RULES.map((rule, i) => {
    const lost = i > 0 && !s.got[i], won = done && s.got[i];
    return `<div class="${lost ? 'lost' : ''}">${art(won ? 'star' : 'star-empty', { size: 22 })}${esc(rule)}</div>`;
  }).join('');
  const shown = r.locks.filter(l => st.hints[l.id] && !isSolved(l, st));
  $('hintbox').classList.toggle('hidden', !shown.length);
  $('hintsH').innerHTML = `${art('bulb', { size: 20 })} Hints`;
  $('hints').innerHTML = shown.map(l => l.hints.slice(0, st.hints[l.id]).map((h, i) =>
    `<div class="${i === l.hints.length - 1 ? 'give' : ''}" style="--lc:${lockColor(r, l)}"><b>${esc(l.title)} · ${HINT_TIERS[i] || 'Hint'}</b>${esc(h)}</div>`).join('')).join('');
  $('log').innerHTML = S.log.slice(0, 8).map(l => `<div>${l}</div>`).join('');

  $('lobby').classList.toggle('hidden', !S.lobby);
  if (S.lobby) renderLobby($('lobby'), {
    room: room.room, title: STORY.title,
    seats: Object.entries(SEATS).map(([k, v]) => ({ ...v, taken: !!room.seat(k), name: room.seat(k)?.name, connected: room.connected(k) })),
    startable: bothSeated(), startLabel: S.started ? `Resume room ${S.level + 1}` : 'Start',
  });

  const over = done && !S.lobby && Date.now() >= escapeAt + 2900;
  const picking = !!$('card').dataset.picker;
  if (!picking) $('card').classList.toggle('hidden', !over);
  if (over && !picking && !$('card').dataset.shown) escapedCard();
  if (!over) delete $('card').dataset.shown;
  sendViews();
}

// The escaped card: stars arrive one by one, then Wren's journal page unfolds and writes itself.
async function escapedCard() {
  const r = R(), last = S.level >= ROOMS.length - 1, s = starsFor(r, S.st);
  $('card').dataset.shown = '1';
  $('card').innerHTML = `<div class="card escaped">
    <h2>${last ? 'The trail is complete' : 'Room escaped'}</h2>
    <div class="stars">${STAR_RULES.map((rule, i) => `<div class="st" data-i="${i}">${art('star-empty', { size: 64 })}<small>${esc(rule)}</small></div>`).join('')}</div>
    <div class="journal"><div class="jh">${art('journal', { size: 30 })} From Wren’s journal</div><p id="jtext"></p></div>
    <p style="margin-top:18px"><b>Good stopping point.</b> Progress is saved; close the tab whenever you like.</p>
    ${last ? '<p>Now fill in the playtest rubric together!</p>' : ''}
    <div class="row">${!last ? '<button class="btn go" data-act="next">Next room</button>' : ''}<button class="btn" data-act="replay">Play this room again</button><button class="btn" data-act="pick">All rooms</button></div></div>`;
  for (let i = 0; i < 3; i++) {
    await wait(420);
    const el = $('card').querySelector(`.st[data-i="${i}"]`);
    if (!el) return;
    if (s.got[i]) { el.querySelector('svg').outerHTML = art('star', { size: 64 }); el.classList.add('won'); sfx.coin(); burst(el, { count: 8, spread: 70, size: 16 }); }
    else el.classList.add('missed');
  }
  await wait(300);
  const j = $('card').querySelector('.journal'), text = r.journal || '';
  if (!j) return;
  j.classList.add('open'); sfx.whoosh();
  await wait(450);
  for (let i = 0; i <= text.length; i += 2) {
    const p = $('jtext'); if (!p) return;
    p.textContent = text.slice(0, i); await wait(18);
  }
  if ($('jtext')) $('jtext').textContent = text;
}

function sendViews() {
  const r = R(), done = roomDone(r, S.st);
  for (const seat of SEAT_IDS) room.send(seat, {
    seat, lobby: S.lobby, started: S.started, canStart: S.lobby && bothSeated(),
    level: S.level, rooms: ROOMS.length, roomName: r.name, intro: r.intro, tutorial: !!r.tutorial, done, last: S.last,
    stars: done ? starsFor(r, S.st) : null, starRules: STAR_RULES,
    ...viewFor(r, S.st, seat),
  });
}

document.body.addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (!act) return;
  if (act === 'start') onAction(null, { a: 'start' });
  else if (act === 'swap') { room.swap('sun', 'moon'); render(); }
  else if (act === 'next' || act === 'replay') { delete $('card').dataset.shown; onAction(null, { a: act }); }
  else if (act.startsWith('hint:')) onAction(null, { a: 'hint', lock: act.slice(5) });
  else if (act.startsWith('room:')) { delete $('card').dataset.picker; delete $('card').dataset.shown; enter(+act.slice(5)); }
  else if (act === 'close') { delete $('card').dataset.picker; delete $('card').dataset.shown; render(); }
  else if (act === 'pick') pickRoom();
});
$('swap').onclick = () => { room.swap('sun', 'moon'); render(); };
$('restart').onclick = () => enter(S.level);
$('seats').onclick = () => { S.lobby = true; persist(); render(); };
$('howto').onclick = () => showHelp(HOWTO);
$('sound').onclick = () => { setMuted(!isMuted()); soundBtn(); if (!isMuted()) sfx.select(); };

// Every room, with how you did: the best escape is kept.
function pickRoom() {
  $('card').dataset.picker = '1';
  $('card').classList.remove('hidden');
  $('card').innerHTML = `<div class="card wide"><h2>${esc(STORY.title)}</h2><p>${esc(STORY.intro)}</p><div class="rooms">${ROOMS.map((x, i) => {
    const res = S.results[i], locked = i > S.unlocked, stars = res?.stars ?? (res ? 1 : 0);
    return `<button class="roomtile${i === S.level ? ' on' : ''}${locked ? ' locked' : ''}" data-act="room:${i}" ${locked ? 'disabled' : ''}>
      <div class="thumb">${sceneSvg(x.scene)}${locked ? `<span class="lk">${art('lock', { size: 40 })}</span>` : ''}</div>
      <b>${i + 1}. ${esc(x.name)}</b>
      <span class="mini">${[0, 1, 2].map(k => art(k < stars ? 'star' : 'star-empty', { size: 18 })).join('')}</span>
      <small>${res ? `escaped · ${res.hints === 0 ? 'no hints' : res.hints + ' hint' + (res.hints > 1 ? 's' : '')}` : locked ? 'escape the room before it first' : x.tutorial ? 'practice' : 'not escaped yet'}</small></button>`;
  }).join('')}</div>
    <div class="row"><button class="btn sm" data-act="close">Cancel</button></div></div>`;
}
$('rooms').onclick = pickRoom;
render();
</script>
</body>
</html>
