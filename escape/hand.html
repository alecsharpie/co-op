<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Escape Room · Hand</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="escape.css">
<style>
  body { height: auto; min-height: 100%; user-select: none; -webkit-user-select: none; }
  #app { padding: 12px 16px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 12px; min-height: 100vh; }
  .top { display: flex; align-items: center; gap: 10px; font-size: 16px; }
  .top .role { font-weight: 800; font-size: 22px; white-space: nowrap; }
  .top .sp { flex: 1; }
  .msg { padding: 14px 16px; border-radius: var(--radius); background: var(--panel); border: 2px solid var(--line); font-size: 18px; line-height: 1.35; }
  .msg.you { border-color: var(--accent); }
  .msg.good { border-color: var(--good); }
  .msg.bad { border-color: var(--bad); }
  .msg small { display: block; color: var(--ink-2); font-size: 15px; margin-top: 4px; }
  .center { margin: auto 0; text-align: center; display: flex; flex-direction: column; gap: 14px; }
  .center h1 { margin: 0; font-size: 34px; }
  input { font: inherit; font-size: 28px; padding: 14px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--bg-2); color: var(--ink); text-align: center; width: 100%; }
  input.code { letter-spacing: .25em; text-transform: uppercase; font-weight: 800; }
  .label { color: var(--ink-2); font-size: 15px; }
  h2 { margin: 6px 0 0; font-size: 17px; color: var(--ink-2); font-weight: 600; }
  .locklist { display: flex; flex-direction: column; gap: 10px; }
  .lockbtn { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; }
  .lockbtn .ico { font-size: 30px; }
  .lockbtn .st { margin-left: auto; font-size: 15px; color: var(--ink-2); font-weight: 500; }
  .lockbtn.open { border-color: var(--good); opacity: .6; }
  .lockbtn.final { border-color: var(--accent); }
  .slots { display: flex; gap: 8px; justify-content: center; }
  .slots .s { width: 58px; height: 66px; border-radius: 12px; border: 2px dashed var(--line); background: var(--bg-2); display: grid; place-items: center; font-size: 30px; font-weight: 800; font-family: var(--font-display); }
  .slots .s.full { border-style: solid; border-color: var(--lc, var(--accent)); animation: slot-in .18s ease-out; }
  @keyframes slot-in { from { transform: scale(.7); } }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .keys .btn { font-size: 32px; padding: 0; min-height: 70px; display: grid; place-items: center; }
  .keys.digits .btn { background: linear-gradient(#f3d27a, #d8a948); color: #3a2600; border-color: #8a6a2a; box-shadow: 0 4px 0 #8a6a2a; font-family: var(--font-display); }
  .keys.digits .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a6a2a; }
  .keys.colors .btn { display: grid; place-items: center; min-height: 84px; }
  .keys.pick { grid-template-columns: 1fr; }
  .keys.pick .btn.on { background: var(--accent); color: var(--accent-ink); }
  .keys.coord { grid-template-columns: repeat(5, 1fr); }
  .keys.coord .btn { font-size: 26px; min-height: 64px; }
  .keys.coord .btn.on { background: var(--accent); color: var(--accent-ink); }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; }
  .big { min-height: 76px; font-size: 24px; }
  .lockgroup { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 18px; background: color-mix(in srgb, var(--lc) 9%, var(--bg)); border: 2px solid color-mix(in srgb, var(--lc) 55%, transparent); }
  .lockgroup.entering { border-color: var(--lc); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lc) 30%, transparent); }
  .lockgroup.folded { padding: 8px 12px; opacity: .7; }
  .lg-h { display: flex; align-items: center; gap: 10px; font-size: 21px; font-family: var(--font-display); }
  .keypad { display: flex; flex-direction: column; gap: 10px; padding-top: 6px; border-top: 2px dashed color-mix(in srgb, var(--lc) 45%, transparent); }
  .lg-h .st { margin-left: auto; font-size: 14px; color: var(--ink-2); white-space: nowrap; }
  .lg-sub { color: var(--ink-2); font-size: 15px; margin-top: -4px; }
  .lg-enter { width: 100%; background: var(--lc); border-color: var(--lc); color: #10172a; }
  .lg-enter small { font-weight: 500; opacity: .8; }
  .lockgroup.mystery { --lc: var(--line); border-style: dashed; color: var(--ink-2); font-size: 16px; }
  .opened { display: flex; flex-wrap: wrap; gap: 8px; }
  .opened .chip { color: var(--good); border-color: var(--good); }
  .stars { display: flex; justify-content: center; gap: 10px; }
  .stars div { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 96px; font-size: 12px; color: var(--ink-2); }
  .portrait { display: grid; place-items: center; }
  .format { text-align: center; color: var(--ink-2); font-size: 15px; margin-top: -4px; }
  .dial { position: relative; width: min(300px, 80vw); aspect-ratio: 1; margin: 6px auto; border-radius: 50%; background: radial-gradient(circle, #2a3654, var(--bg-2)); border: 2px solid var(--line); }
  .dial .btn { position: absolute; width: 58px; min-height: 58px; height: 58px; padding: 0; border-radius: 50%; font-size: 22px; transform: translate(-50%, -50%); }
  .dial .btn.on { background: var(--accent); color: var(--accent-ink); }
  .dial .mid { position: absolute; inset: 0; display: grid; place-items: center; font-size: 46px; font-weight: 800; color: var(--accent); pointer-events: none; font-family: var(--font-display); }
  .dial .hand { position: absolute; left: 50%; top: 50%; width: 6px; height: 30%; margin-left: -3px; background: var(--accent); border-radius: 3px; transform-origin: 50% 0; transition: transform .35s cubic-bezier(.3, 1.5, .5, 1); pointer-events: none; }
  .tickhint { color: var(--ink-2); font-size: 13px; text-align: center; }
  .shake { animation: shake .45s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { joinRoom, param, load, save } from '../shared/net.js';
import { showHelp, helpOnce, roleCard, helpButtonHtml } from '../shared/help.js';
import { sfx } from '../shared/sfx.js';
import { burst } from '../shared/art.js';
import { cardHtml, token, esc, dirIcon } from './cards.js';
import { art } from './art.js';

const $app = document.getElementById('app');
const ROLE = { sun: ['sun', 'Sun'], moon: ['moon', 'Moon'] };
const buzz = p => { if (navigator.vibrate) navigator.vibrate(p); };

let status = 'connecting', seat = null, V = null, link = null;
// local: which lock's keypad is open, what has been typed, and the last try this phone has reacted to
let entering = null, value = [], seen = null, note = null, noteTimer = null, pendingBurst = false;
// items this phone has ticked off on its clue cards, per room: `${cardKey}:${item}`
let ticks = new Set(), ticksFor = null, helped = false; // helped: the role card has had its chance this page load
const tickKey = () => `coop-escape-ticks-${room}-${V.level}`;

const ROLE_CARD = seat => roleCard({
  icon: art(ROLE[seat][0], { size: 40 }), role: ROLE[seat][1],
  goal: 'Escape each room together. Your phone shows half of every clue; your partner’s phone shows the other half.',
  can: [
    'See your half of the clues. Each clue is coloured like the lock it opens.',
    'Enter an answer on any lock: tap <b>Enter answer</b> under its clues. The TV shows your partner how far you have typed.',
    'Tap things on your cards to tick them off as you read them out.',
    'On the last lock of a room, enter what is shown on your <b>partner’s</b> phone.',
  ],
  partner: ['See the other half of every clue.', 'Read out the half-key you need for the last lock.'],
  tips: ['Describe, don’t guess: say exactly what you see, in order.', 'There is no timer. A wrong try lights the tumblers that were right, but costs a star after two.', 'Stuck? Tap a bulb on the TV: nudge first, give-away last.'],
});

const room = (param('room') || '').toUpperCase();
if (!room) joinForm(); else connect(room);

function joinForm() {
  $app.innerHTML = `<div class="center">
    <div class="portrait">${art('obj-padlock', { size: 90 })}</div><h1>Escape Room</h1>
    <div class="label">Room code on the TV</div>
    <input class="code" id="code" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="ABCDE">
    <div class="label">Your name (optional)</div>
    <input id="name" maxlength="16" value="${esc(load('coop-name', ''))}">
    <button class="btn go big" id="go">Join</button></div>`;
  document.getElementById('go').onclick = () => {
    const code = document.getElementById('code').value.trim().toUpperCase();
    if (code.length !== 5) return document.getElementById('code').focus();
    save('coop-name', document.getElementById('name').value.trim());
    const u = new URL(location.href); u.searchParams.set('room', code); location.href = u.href;
  };
}

function connect(code) {
  link = joinRoom({
    room: code, name: load('coop-name', ''), want: param('want'),
    onSeat: s => { seat = s; render(); },
    onMessage: v => { if (V && v.level !== V.level) { note = null; entering = null; value = []; } react(v); V = v; render(); },
    onStatus: s => { status = s; render(); },
  });
  render();
}

// A try just landed: tell this phone how it went (its own try) or what the partner managed.
function react(v) {
  const l = v.last;
  if (!l || seen === null) { seen = l ? l.n : 0; return; }
  if (l.n <= seen) return;
  seen = l.n;
  const lock = v.locks.find(x => x.id === l.lock), title = lock ? lock.title.toLowerCase() : 'lock';
  if (l.seat === v.seat) {
    note = l.opened ? ['good', `The ${title} is open!`] : l.ok ? ['good', `Your half is in. Now your partner enters theirs.`]
      : ['bad', `Not quite.${l.close != null ? ` ${l.close} of ${lock?.input.len || 0} in the right place.` : ''} The ${title} stays shut.`];
    if (l.ok) { entering = null; value = []; }
    if (l.opened) { sfx.great(); buzz([20, 40, 80]); } else if (l.ok) { sfx.good(); buzz(30); } else { sfx.bad(); buzz([40, 60, 40]); }
  } else {
    note = l.opened ? ['good', `Your partner opened the ${title}!`] : l.ok ? ['good', `Your partner’s half of the ${title} is in. Now yours.`] : ['', `Your partner tried the ${title}. Still locked.`];
    if (l.opened && entering === l.lock) { entering = null; value = []; }
    if (l.opened) { sfx.good(); buzz([20, 40, 60]); }
  }
  pendingBurst = l.opened;
  clearTimeout(noteTimer); noteTimer = setTimeout(() => { note = null; render(); }, 3500);
}

function render() {
  if (!seat || !V || V.seat !== seat) {
    $app.innerHTML = `<div class="center"><div class="portrait">${art('obj-padlock', { size: 80 })}</div><div class="msg">${
      status === 'full' ? 'Both seats are taken in this room.' :
      status === 'waiting' ? `Looking for the board of room ${esc(room)}…<small>Is the TV page open?</small>` :
      seat ? 'Connected. Waiting for the board…' : `Joining room ${esc(room)}…`}</div></div>`;
    return;
  }
  const [sprite, name] = ROLE[seat], icon = art(sprite, { size: 30 });
  if (ticksFor !== `${room}-${V.level}`) { ticksFor = `${room}-${V.level}`; ticks = new Set(load(tickKey(), [])); }
  if (!V.lobby && !helped) { helped = true; helpOnce(`escape-${seat}`, ROLE_CARD(seat)); }
  const net = status === 'open' ? '' : `<span class="chip"><span class="dot"></span>reconnecting</span>`;
  let h = `<div class="top"><span class="role">${icon} ${name}</span>${net}<span class="sp"></span>${V.started ? `<span class="chip">Room ${V.level + 1}/${V.rooms}</span>` : ''}${helpButtonHtml()}</div>`;

  if (V.lobby) {
    h += `<div class="center"><div class="portrait bob">${art(sprite, { size: 120 })}</div><div class="msg">You are <b>${name}</b>.<small>You will see half of every clue. Your partner sees the other half. Talk!</small></div>
      ${V.canStart ? `<button class="btn go big" data-act="start">${V.started ? 'Resume' : 'Start'}</button>` : '<div class="label">Waiting for your partner to join…</div>'}</div>`;
  } else if (V.done) {
    const st = V.stars;
    h += `<div class="center"><div class="portrait">${art('exit-frame', { size: 110 })}</div><div class="msg good">${esc(V.roomName)}: escaped!<small>Look at the TV for the next page of Wren’s journal. Good stopping point: progress is saved.</small></div>
      ${st ? `<div class="stars">${V.starRules.map((rule, i) => `<div>${art(st.got[i] ? 'star' : 'star-empty', { size: 44 })}${esc(rule)}</div>`).join('')}</div>` : ''}
      ${V.level < V.rooms - 1 ? '<button class="btn go big" data-act="next">Next room</button>' : '<div class="msg">That was the last room. The trail is complete.</div>'}
      <button class="btn" data-act="replay">Play this room again</button></div>`;
  } else {
    if (entering && !V.locks.some(l => l.id === entering && !l.mine)) entering = null;
    h += note ? `<div class="msg ${note[0]}${note[0] === 'bad' ? ' shake' : ''}">${esc(note[1])}</div>`
      : `<div class="msg you">${esc(V.roomName)}<small>${V.tutorial ? 'Practice room: follow the steps on your first card.' : 'Read your clues out loud. Each lock needs both of your phones.'}</small></div>`;
    const open = V.locks.filter(l => !l.solved), done = V.locks.filter(l => l.solved);
    h += open.map(l => {
      const cards = V.cards.filter(c => c.lock === l.id), here = entering === l.id, folded = entering && !here;
      const st = l.final ? (l.mine ? 'your half is in' : l.partner ? 'partner’s half is in' : 'needs you both') : 'locked';
      const head = `<div class="lg-h">${art(l.icon, { size: 36 })}<b>${esc(l.title)}</b><span class="st">${art(l.mine ? 'check' : 'lock', { size: 16 })} ${st}</span></div>`;
      if (folded) return `<section class="lockgroup folded" style="--lc:${l.color}" data-act="open:${l.id}">${head}</section>`;
      return `<section class="lockgroup${here ? ' entering' : ''}" style="--lc:${l.color}" data-lock="${l.id}">
        ${head}
        ${l.final ? '<div class="lg-sub">Last lock: you each enter what your <b>partner’s</b> phone shows.</div>' : ''}
        ${cards.map(c => cardHtml(c, ticks)).join('')}
        ${here ? keypad(l) : `<button class="btn lg-enter" data-act="open:${l.id}" ${l.mine ? 'disabled' : ''}>${l.mine ? 'Your half is in' : l.final ? 'Enter your partner’s half' : 'Enter answer'} <small>· ${esc(l.format)}</small></button>`}
      </section>`;
    }).join('');
    if (V.hiddenFinal) h += `<section class="lockgroup mystery">${art('question', { size: 24 })} One more lock appears when these are open.</section>`;
    if (done.length) h += `<div class="opened">${done.map(l => `<span class="chip">${art('unlock', { size: 16 })} ${esc(l.title)}</span>`).join('')}</div>`;
    h += `<div class="tickhint">Tip: tap anything on a card to tick it off.</div>`;
  }
  $app.innerHTML = h;
  if (pendingBurst) { pendingBurst = false; const m = $app.querySelector('.msg.good'); if (m) burst(m, { count: 12, spread: 90, size: 18 }); }
  if (scrollTo) { const g = $app.querySelector(`.lockgroup[data-lock="${scrollTo}"] .keypad`); scrollTo = null; if (g) g.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
}
let scrollTo = null;

function keypad(l) {
  const i = l.input, kind = i.type, len = i.len || (kind === 'coord' ? 2 : 1);
  let h = `<div class="keypad">`;
  h += `<div class="format">${l.final ? 'Enter your <b>partner’s</b> half: ask what their card shows.' : `Enter ${esc(l.format)}`}</div>`;
  if (kind !== 'pick' && kind !== 'clock') h += `<div class="slots">${Array.from({ length: len }, (_, k) => `<div class="s${value[k] ? ' full' : ''}">${value[k] ? token(kind, value[k]) : ''}</div>`).join('')}</div>`;
  const full = value.length >= len;
  const key = (v, label, cls = '') => `<button class="btn ${cls}" data-act="key:${v}" ${full && kind !== 'pick' && kind !== 'coord' ? 'disabled' : ''}>${label}</button>`;
  if (kind === 'digits') h += `<div class="keys digits">${'123456789'.split('').map(d => key(d, d)).join('')}<span></span>${key('0', '0')}<span></span></div>`;
  if (kind === 'dirs') h += `<div class="keys"><span></span>${key('N', dirIcon('N', 40))}<span></span>${key('W', dirIcon('W', 40))}<span></span>${key('E', dirIcon('E', 40))}<span></span>${key('S', dirIcon('S', 40))}<span></span></div>`;
  if (kind === 'colors') h += `<div class="keys colors">${i.options.map(c => key(c, token('colors', c, true))).join('')}</div>`;
  if (kind === 'pick') h += `<div class="keys pick">${i.options.map(o => `<button class="btn big${value[0] === o ? ' on' : ''}" data-act="key:${o}">${esc(i.label)} ${esc(o)}</button>`).join('')}</div>`;
  if (kind === 'coord') h += `<div class="label">Column</div><div class="keys coord">${[...i.cols].map(c => `<button class="btn${value[0] === c ? ' on' : ''}" data-act="col:${c}">${c}</button>`).join('')}</div>
    <div class="label">Row</div><div class="keys coord">${[...i.rows].map(r => `<button class="btn${value[1] === r ? ' on' : ''}" data-act="row:${r}">${r}</button>`).join('')}</div>`;
  if (kind === 'clock') h += `<div class="dial"><div class="hand" style="transform:rotate(${value[0] ? 180 + value[0] * 30 : 180}deg)"></div><div class="mid">${value[0] || ''}</div>${Array.from({ length: 12 }, (_, k) => {
    const hr = k + 1, a = (hr / 12) * 2 * Math.PI;
    return `<button class="btn${value[0] === String(hr) ? ' on' : ''}" data-act="key:${hr}" style="left:${50 + 40 * Math.sin(a)}%;top:${50 - 40 * Math.cos(a)}%">${hr}</button>`;
  }).join('')}</div>`;
  const single = kind === 'pick' || kind === 'clock';
  h += `<div class="row"><button class="btn" data-act="back" style="flex:none">Back</button>${single || kind === 'coord' ? '' : `<button class="btn" data-act="del" aria-label="Delete" ${value.length ? '' : 'disabled'}>${art('backspace', { size: 30 })}</button>`}
    <button class="btn go big" data-act="try" ${full && (kind !== 'coord' || (value[0] && value[1])) ? '' : 'disabled'}>Try it</button></div></div>`;
  return h;
}

$app.addEventListener('click', e => {
  const t = e.target.closest('.clue [data-t]');
  if (t && !e.target.closest('[data-act]')) {
    const k = `${t.closest('.clue').dataset.key}:${t.dataset.t}`;
    ticks.has(k) ? ticks.delete(k) : ticks.add(k);
    save(tickKey(), [...ticks]);
    t.toggleAttribute('data-ticked');
    return;
  }
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  if (b.dataset.act === 'help') return showHelp(ROLE_CARD(seat));
  buzz(8);
  const [k, v] = b.dataset.act.split(':');
  const lock = V && V.locks.find(l => l.id === entering), len = lock ? lock.input.len || 1 : 0;
  const was = value.filter(Boolean).length;
  if (k === 'start' || k === 'next' || k === 'replay') { sfx.select(); link.act({ a: k }); }
  else if (k === 'open') { if (entering && entering !== v) link.act({ a: 'typing', lock: entering, n: 0 }); entering = v; value = []; note = null; scrollTo = v; sfx.select(); }
  else if (k === 'back') { if (entering) link.act({ a: 'typing', lock: entering, n: 0 }); entering = null; value = []; note = null; sfx.back(); }
  else if (k === 'key' && lock) { if (lock.input.type === 'pick' || lock.input.type === 'clock') value = [v]; else if (value.length < len) value.push(v); sfx.tap(); }
  else if (k === 'col') { value = [v, value[1]]; sfx.tap(); }
  else if (k === 'row') { value = [value[0], v]; sfx.tap(); }
  else if (k === 'del') { value.pop(); sfx.back(); }
  else if (k === 'try' && lock) { link.act({ a: 'try', lock: lock.id, value }); value = []; sfx.lock(); }
  const now = value.filter(Boolean).length;
  if (lock && now !== was && k !== 'try') link.act({ a: 'typing', lock: lock.id, n: now });
  render();
});
</script>
</body>
</html>
