<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lighthouse · Board</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="tiles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
  header h1 { margin: 0; font-size: 22px; }
  header .bay { color: var(--ink-2); font-size: 18px; }
  header .sp { flex: 1; }
  main { display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  #sea { display: grid; place-items: center; min-height: 0; padding: 16px; position: relative; }
  aside { border-left: 1px solid var(--line); padding: 18px; display: flex; flex-direction: column; gap: 16px; overflow: auto; background: var(--bg-2); }
  .stat { display: flex; justify-content: space-between; align-items: baseline; font-size: 20px; }
  .stat b { font-size: 28px; }
  .phase { padding: 16px; border-radius: var(--radius); background: var(--panel); border: 2px solid var(--line); font-size: 20px; line-height: 1.3; }
  .phase.you { border-color: var(--accent); }
  .phase small { display: block; color: var(--ink-2); font-size: 15px; margin-top: 6px; }
  .signals { display: flex; gap: 10px; min-height: 76px; }
  .signals .sig { width: 76px; height: 76px; font-size: 44px; display: grid; place-items: center; border-radius: 16px; background: var(--accent); color: var(--accent-ink); }
  .log { color: var(--ink-2); font-size: 15px; line-height: 1.5; }
  .settings { margin-top: auto; display: flex; flex-wrap: wrap; gap: 8px; }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 10, 20, .82); z-index: 10; padding: 24px; }
  .card { max-width: 640px; text-align: center; padding: 36px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 24px; }
  .card h2 { font-size: 40px; margin: 0 0 10px; }
  .card p { font-size: 20px; color: var(--ink-2); }
  .card .row { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
  .toast { position: absolute; top: 24px; left: 50%; transform: translateX(-50%); padding: 10px 20px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 22px; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .toast.calm { background: var(--water-2); }
</style>
</head>
<body>
<header>
  <h1>🗼 Lighthouse &amp; Navigator</h1>
  <span class="bay" id="bay"></span>
  <span class="sp"></span>
  <span class="chip" id="net"><span class="dot"></span><span>connecting</span></span>
  <span class="chip" id="room"></span>
</header>
<main>
  <div id="sea"><div class="board" id="grid"></div><div class="toast" id="toast"></div></div>
  <aside>
    <div class="stat"><span>Lamp oil</span><b id="oil"></b></div>
    <div class="stat"><span>Hull</span><b id="hull"></b></div>
    <div class="phase" id="phase"></div>
    <div id="sigbox"><div style="color:var(--ink-2);margin-bottom:8px">Signals from the keeper</div><div class="signals" id="signals"></div></div>
    <div class="log" id="log"></div>
    <div class="settings">
      <button class="btn sm" id="mode"></button>
      <button class="btn sm" id="swap">Swap roles</button>
      <button class="btn sm" id="restart">Restart bay</button>
      <button class="btn sm" id="bays">Bays</button>
      <button class="btn sm" id="seats">Show join code</button>
    </div>
  </aside>
</main>
<div class="overlay hidden" id="lobby"></div>
<div class="overlay hidden" id="card"></div>

<script type="module">
import { hostRoom, load, save } from '../shared/net.js';
import { renderLobby, findLan } from '../shared/lobby.js';
import { newTurn, submit, phaseOf, lockedIn } from '../shared/phases.js';
import { PHASES, parseLevel, newGame, light, sail, visibleDrifters, driftNext, SIGNALS_PER_TURN, MOVES_PER_TURN } from './game.js';
import { LEVELS } from './levels.js';
import { drawSea, SIGNAL_ICON, MOVE_ICON } from './draw.js';

const $ = id => document.getElementById(id);
const bays = LEVELS.map(d => parseLevel({ drifters: [], ...d }));
const SEATS = {
  keeper: { label: 'Keeper', icon: '🗼', blurb: 'sees the whole bay on their phone, aims the lamp' },
  navigator: { label: 'Navigator', icon: '⛵', blurb: 'sees only what is lit, steers the boat' },
};

const room = hostRoom({ game: 'lighthouse', seats: Object.keys(SEATS), onSeats: render, onAction, onStatus });
const KEY = `coop-lighthouse-${room.room}`;
// the save: everything needed to pick up exactly where we stopped
let S = load(KEY) || { level: 0, unlocked: 0, mode: 'talk', game: null, turn: newTurn(), log: [], lobby: true };
let busy = false; // animating a sail: actions wait
const persist = () => save(KEY, S);
const lv = () => bays[S.level];

$('room').textContent = 'Room ' + room.room;
await findLan();

function onStatus(st) {
  $('net').innerHTML = `<span class="dot${st === 'open' ? ' on' : ''}"></span><span>${st === 'open' ? (room.net === 'local' ? 'local tabs' : 'online') : st}</span>`;
}

function start(level) {
  S.level = level; S.game = newGame(bays[level]); S.turn = newTurn(); S.lobby = false;
  S.log = [`Bay ${level + 1}: ${bays[level].name}. ${bays[level].intro}`];
  persist(); render();
}

function onAction(seat, a) {
  if (!a || typeof a !== 'object' || busy) return;
  if (a.a === 'next' && S.game?.status === 'won') return start(Math.min(S.level + 1, bays.length - 1));
  if (a.a === 'retry' && S.game?.status === 'lost') return start(S.level);
  if (a.a === 'start' && S.lobby && bothSeated()) return start(S.game ? S.level : 0);
  if (!S.game || S.game.status !== 'play' || S.lobby) return;
  const ph = phaseOf(PHASES, S.turn);
  if (a.a === 'light' && ph?.name === 'light' && seat === 'keeper') {
    S.turn = submit(PHASES, S.turn, seat, true).turn;
    S.game = light(S.game, lv(), a.beam, S.mode === 'signals' ? a.signals : []);
    S.log.unshift(S.game.beam ? 'The lamp swings across the water.' : 'The keeper keeps the lamp low.');
    persist(); render();
  } else if (a.a === 'sail' && ph?.name === 'steer' && seat === 'navigator') {
    S.turn = submit(PHASES, S.turn, seat, true).turn;
    play(sail(S.game, lv(), a.plan));
  }
}

const NEWS = { bump: ['Crunch! Rocks.', false], ice: ['Ice! The hull groans.', false], current: ['Swept along by the current', true] };
async function play({ state, frames }) {
  busy = true;
  const before = S.game;
  for (const f of frames) {
    S.game = { ...before, boat: f.boat, drifters: f.drifters, hull: f.hull, seen: state.seen };
    render();
    if (NEWS[f.event]) toast(...NEWS[f.event]);
    await new Promise(r => setTimeout(r, 520));
  }
  S.game = state; S.turn = newTurn();
  S.log.unshift(`Turn ${before.turn}: sailed ${state.lastPlan.map(m => MOVE_ICON[m]).join(' ') || 'nowhere'}.`);
  if (state.status === 'won') { S.unlocked = Math.max(S.unlocked, Math.min(S.level + 1, bays.length - 1)); S.log.unshift('Home safe.'); }
  busy = false; persist(); render();
}

let toastTimer;
function toast(text, calm) {
  const t = $('toast'); t.textContent = text; t.className = 'toast show' + (calm ? ' calm' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.className = 'toast', 1400);
}

const bothSeated = () => Object.keys(SEATS).every(s => room.seat(s));

function render() {
  const g = S.game, ph = g && phaseOf(PHASES, S.turn);
  $('mode').textContent = S.mode === 'talk' ? 'Mode: talk freely' : 'Mode: signals only';

  // lobby
  $('lobby').classList.toggle('hidden', !S.lobby);
  if (S.lobby) renderLobby($('lobby'), {
    room: room.room, title: 'Lighthouse & Navigator',
    seats: Object.entries(SEATS).map(([k, v]) => ({ ...v, taken: !!room.seat(k), name: room.seat(k)?.name, connected: room.connected(k) })),
    startable: bothSeated(), startLabel: g && g.status === 'play' ? `Resume bay ${S.level + 1}` : 'Start',
  });

  if (g) {
    $('bay').textContent = `Bay ${S.level + 1} of ${bays.length}: ${lv().name} · turn ${g.turn}`;
    $('oil').textContent = '🛢️'.repeat(Math.max(0, g.oil)) || '—';
    $('hull').textContent = '❤️'.repeat(Math.max(0, g.hull)) || '💥';
    drawSea($('grid'), lv(), g, { tv: true, drifters: visibleDrifters(g, lv()) });
    const who = ph?.name === 'light' ? 'keeper' : 'navigator', nm = room.seat(who)?.name || SEATS[who].label;
    $('phase').className = 'phase you';
    $('phase').innerHTML = g.status !== 'play' ? (g.status === 'won' ? '⚓ Safe in the harbour' : '💥 ' + g.why)
      : busy ? 'Sailing…'
      : ph?.name === 'light' ? `🗼 <b>${esc(nm)}</b>, aim the lamp${S.mode === 'signals' ? ' and pick up to ' + SIGNALS_PER_TURN + ' signals' : ''}.<small>${S.mode === 'signals' ? 'Signals only: no talking about the route!' : 'Talk it through.'}</small>`
      : `⛵ <b>${esc(nm)}</b>, plot up to ${MOVES_PER_TURN} moves and sail.<small>Your plan stays secret until you sail.</small>`;
  }
  $('sigbox').classList.toggle('hidden', S.mode !== 'signals');
  $('signals').innerHTML = (g?.signals || []).map(s => `<div class="sig">${SIGNAL_ICON[s]}</div>`).join('');
  $('log').innerHTML = (S.log || []).slice(0, 6).map(l => `<div>${esc(l)}</div>`).join('');

  // win / lose card
  const over = g && !busy && !S.lobby && g.status !== 'play';
  $('card').classList.toggle('hidden', !over);
  if (over) {
    const last = S.level >= bays.length - 1;
    $('card').innerHTML = `<div class="card">
      <h2>${g.status === 'won' ? '⚓ Home safe' : '🌊 Lost at sea'}</h2>
      <p>${esc(g.why)} ${g.status === 'won' ? `Took ${g.turn} turns with ${g.hull} hull to spare.` : ''}</p>
      <p><b>Good stopping point.</b> Progress is saved; close the tab whenever you like.</p>
      <div class="row">
        ${g.status === 'won' && !last ? '<button class="btn go" data-act="next">Next bay</button>' : ''}
        ${g.status === 'won' && last ? '<p>That was every bay. Fill in the playtest rubric together!</p>' : ''}
        <button class="btn" data-act="retry">${g.status === 'won' ? 'Play this bay again' : 'Try again'}</button>
      </div></div>`;
  }
  sendViews();
}

// What each phone may know. The keeper sees everything but the navigator's plan; the navigator gets no map at all
// (the TV is their view) beyond the keeper's signals.
function sendViews() {
  const g = S.game, ph = g && phaseOf(PHASES, S.turn);
  const common = {
    lobby: S.lobby, started: !!g, mode: S.mode, busy, level: S.level, bayName: lv().name,
    phase: ph?.name || null, status: g?.status || null, why: g?.why || '', oil: g?.oil, hull: g?.hull, turn: g?.turn,
    canStart: S.lobby && bothSeated(), locked: g ? lockedIn(PHASES, S.turn) : {},
  };
  room.send('keeper', {
    ...common, seat: 'keeper',
    map: g && { w: lv().w, h: lv().h, rows: lv().rows, harbor: lv().harbor },
    boat: g?.boat, beam: g?.beam, signals: g?.signals || [], lastPlan: g?.lastPlan || [],
    drifters: g ? g.drifters.map(d => ({ x: d.x, y: d.y, next: driftNext(lv(), d) })) : [],
  });
  room.send('navigator', { ...common, seat: 'navigator', signals: ph?.name === 'steer' || busy ? g.signals : [] });
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

document.body.addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'start') onAction(null, { a: 'start' });
  if (act === 'swap') { room.swap('keeper', 'navigator'); render(); }
  if (act === 'next') onAction(null, { a: 'next' });
  if (act === 'retry') onAction(null, { a: 'retry' });
  if (act?.startsWith('bay:')) start(+act.slice(4));
});
$('mode').onclick = () => { S.mode = S.mode === 'talk' ? 'signals' : 'talk'; persist(); render(); };
$('swap').onclick = () => { room.swap('keeper', 'navigator'); render(); };
$('restart').onclick = () => { if (!busy) start(S.level); };
$('seats').onclick = () => { S.lobby = true; persist(); render(); };
$('bays').onclick = () => {
  $('card').classList.remove('hidden');
  $('card').innerHTML = `<div class="card"><h2>Choose a bay</h2><div class="row">${bays.map((b, i) =>
    `<button class="btn${i === S.level ? ' on' : ''}" data-act="bay:${i}" ${i > S.unlocked ? 'disabled' : ''}>${i + 1}. ${esc(b.name)}</button>`).join('')}</div></div>`;
};
addEventListener('resize', render);
render();
</script>
</body>
</html>
