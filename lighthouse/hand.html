<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0b1424">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Lighthouse · Hand</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="tiles.css">
<style>
  body { padding: 12px 16px calc(16px + env(safe-area-inset-bottom)); min-height: 100%; height: auto; user-select: none; -webkit-user-select: none; }
  #app { display: flex; flex-direction: column; gap: 12px; min-height: calc(100vh - 28px); }
  .top { display: flex; align-items: center; gap: 12px; font-size: 20px; white-space: nowrap; }
  .top .role { font-weight: 800; font-size: 22px; }
  .top .sp { flex: 1; }
  .msg { padding: 14px 16px; border-radius: var(--radius); background: var(--panel); border: 2px solid var(--line); font-size: 19px; line-height: 1.35; }
  .msg.you { border-color: var(--accent); }
  .msg small { display: block; color: var(--ink-2); font-size: 15px; margin-top: 4px; }
  .center { margin: auto 0; text-align: center; display: flex; flex-direction: column; gap: 14px; }
  .center h1 { margin: 0; font-size: 34px; }
  input { font: inherit; font-size: 28px; padding: 14px; border-radius: var(--radius); border: 2px solid var(--line); background: var(--bg-2); color: var(--ink); text-align: center; width: 100%; }
  input.code { letter-spacing: .25em; text-transform: uppercase; font-weight: 800; }
  #map { display: grid; place-items: center; }
  .tray { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .slot { height: 72px; border-radius: var(--radius); border: 2px dashed var(--line); display: grid; place-items: center; font-size: 40px; background: var(--bg-2); }
  .slot.full { border-style: solid; background: var(--panel); }
  .palette { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .palette .btn { font-size: 34px; padding: 0; min-height: 68px; }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 92px); gap: 10px; }
  .pad .btn { font-size: 46px; padding: 0; min-height: 0; }
  .pad .wait { font-size: 22px; }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; }
  .big { min-height: 76px; font-size: 24px; }
  .signals { display: flex; gap: 10px; justify-content: center; min-height: 84px; }
  .signals .sig { width: 84px; height: 84px; font-size: 50px; display: grid; place-items: center; border-radius: 18px; background: var(--accent); }
  .label { color: var(--ink-2); font-size: 15px; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import { joinRoom, param, load, save } from '../shared/net.js';
import { parseLevel, SIGNALS, SIGNALS_PER_TURN, MOVES_PER_TURN } from './game.js';
import { drawSea, SIGNAL_ICON, MOVE_ICON } from './draw.js';

const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ROLE = { keeper: ['🗼', 'Keeper'], navigator: ['⛵', 'Navigator'] };

let status = 'connecting', seat = null, V = null, link = null;
// what this phone is composing before it sends: reset when a new turn starts
let aim = null, picks = [], plan = [], composingFor = null;

const room = (param('room') || '').toUpperCase();
if (!room) joinForm(); else connect(room);

function joinForm() {
  $app.innerHTML = `<div class="center">
    <h1>🗼 Lighthouse</h1>
    <div class="label">Room code on the TV</div>
    <input class="code" id="code" maxlength="5" autocomplete="off" autocapitalize="characters" placeholder="ABCDE">
    <div class="label">Your name (optional)</div>
    <input id="name" maxlength="16" value="${esc(load('coop-name', ''))}">
    <button class="btn go big" id="go">Join</button></div>`;
  document.getElementById('go').onclick = () => {
    const code = document.getElementById('code').value.trim().toUpperCase();
    if (code.length !== 5) return document.getElementById('code').focus();
    save('coop-name', document.getElementById('name').value.trim());
    const u = new URL(location.href); u.searchParams.set('room', code); location.href = u.href;
  };
}

function connect(code) {
  link = joinRoom({
    room: code, name: load('coop-name', ''), want: param('want'),
    onSeat: s => { seat = s; render(); },
    onMessage: v => { V = v; render(); },
    onStatus: s => { status = s; render(); },
  });
  render();
}
const act = body => link.act(body);

function render() {
  if (!seat || !V || V.seat !== seat) {
    $app.innerHTML = `<div class="center"><h1>🗼</h1><div class="msg">${
      status === 'full' ? 'Both seats are taken in this room.' :
      status === 'waiting' ? `Looking for the board of room ${esc(room)}…<small>Is the TV page open?</small>` :
      seat ? 'Connected. Waiting for the board…' : `Joining room ${esc(room)}…`}</div></div>`;
    return;
  }
  const [icon, name] = ROLE[seat];
  const net = status === 'open' ? '' : `<span class="chip"><span class="dot"></span>reconnecting</span>`;
  const stats = V.started ? `<span>🛢️ ${V.oil}</span><span>❤️ ${V.hull}</span>` : '';
  let html = `<div class="top"><span class="role">${icon} ${name}</span>${net}<span class="sp"></span>${stats}</div>`;

  if (V.lobby) {
    html += `<div class="center"><div class="msg">You are the <b>${name}</b>.<small>${seat === 'keeper'
      ? 'You will see the whole bay here, and aim the lamp so your partner can see on the TV.'
      : 'You will steer the boat from here. The TV shows only what is lit.'}</small></div>
      ${V.canStart ? `<button class="btn go big" data-act="start">${V.started && V.status === 'play' ? 'Resume' : 'Start'}</button>` : '<div class="label">Waiting for your partner to join…</div>'}</div>`;
  } else if (V.status && V.status !== 'play') {
    html += `<div class="center"><div class="msg you">${V.status === 'won' ? '⚓ Home safe!' : '🌊 ' + esc(V.why)}<small>Good stopping point: progress is saved.</small></div>
      ${V.status === 'won' ? '<button class="btn go big" data-act="next">Next bay</button>' : '<button class="btn go big" data-act="retry">Try again</button>'}</div>`;
  } else {
    const key = `${V.level}:${V.turn}`;
    if (composingFor !== key) { composingFor = key; aim = null; picks = []; plan = []; }
    html += seat === 'keeper' ? keeperUI() : navigatorUI();
  }
  $app.innerHTML = html;
  if (seat === 'keeper' && V.map && !V.lobby && V.status === 'play') {
    const lv = parseLevel({ map: V.map.rows });
    const size = Math.floor((Math.min(innerWidth, 560) - 32) / lv.w);
    drawSea(document.getElementById('grid'), lv, { boat: V.boat, beam: V.beam }, { size, drifters: V.drifters, beam: V.phase === 'light' ? aim : V.beam });
  }
}

function keeperUI() {
  const mine = V.phase === 'light' && !V.busy, signals = V.mode === 'signals';
  let h = `<div class="msg${mine ? ' you' : ''}">${V.busy ? 'Sailing… watch the TV.' : mine
    ? `Tap the water to aim the lamp${signals ? ', then pick up to ' + SIGNALS_PER_TURN + ' signals' : ''}.<small>${signals ? 'Signals only: no talking about the route.' : 'Talk your partner through it.'}</small>`
    : `Your partner is plotting a course…<small>${V.locked.navigator ? 'Locked in.' : 'Their plan is secret until they sail.'}</small>`}</div>`;
  h += `<div id="map"><div class="board" id="grid"></div></div>`;
  if (V.lastPlan.length && !mine) h += `<div class="label" style="text-align:center">Last turn they sailed ${V.lastPlan.map(m => MOVE_ICON[m]).join(' ')}</div>`;
  if (mine) {
    if (signals) {
      h += `<div class="tray">${[0, 1, 2].map(i => `<div class="slot${picks[i] ? ' full' : ''}" data-act="unpick:${i}">${picks[i] ? SIGNAL_ICON[picks[i]] : ''}</div>`).join('')}</div>`;
      h += `<div class="palette">${SIGNALS.map(s => `<button class="btn" data-act="pick:${s}" ${picks.length >= SIGNALS_PER_TURN ? 'disabled' : ''}>${SIGNAL_ICON[s]}</button>`).join('')}</div>`;
    }
    h += `<button class="btn go big" data-act="light">${aim ? '🗼 Light the lamp' : 'Send without lighting'}</button>`;
  }
  return h;
}

function navigatorUI() {
  const mine = V.phase === 'steer' && !V.busy;
  let h = `<div class="msg${mine ? ' you' : ''}">${V.busy ? 'Sailing… watch the TV.' : mine
    ? `Plot up to ${MOVES_PER_TURN} moves, then sail.<small>Look at the TV: you only see what is lit.</small>`
    : `The keeper is aiming the lamp…<small>You can start plotting; you sail once the light is set.</small>`}</div>`;
  if (V.mode === 'signals') h += `<div class="label" style="text-align:center">Signals from the keeper</div><div class="signals">${
    V.signals.length ? V.signals.map(s => `<div class="sig">${SIGNAL_ICON[s]}</div>`).join('') : '<div class="label" style="align-self:center">none yet</div>'}</div>`;
  h += `<div class="tray">${[0, 1, 2].map(i => `<div class="slot${plan[i] ? ' full' : ''}">${plan[i] ? MOVE_ICON[plan[i]] : ''}</div>`).join('')}</div>`;
  const full = plan.length >= MOVES_PER_TURN || V.busy;
  const b = (m, ico, cls = '') => `<button class="btn ${cls}" data-act="move:${m}" ${full ? 'disabled' : ''}>${ico}</button>`;
  h += `<div class="pad"><span></span>${b('N', '⬆️')}<span></span>${b('W', '⬅️')}${b('wait', 'Wait', 'wait')}${b('E', '➡️')}<span></span>${b('S', '⬇️')}<span></span></div>`;
  h += `<div class="row"><button class="btn" data-act="undo" ${plan.length ? '' : 'disabled'}>↩︎ Undo</button>
    <button class="btn go big" data-act="sail" ${mine && plan.length ? '' : 'disabled'}>⛵ Sail</button></div>`;
  return h;
}

$app.addEventListener('click', e => {
  const tile = e.target.closest('.t');
  if (tile && seat === 'keeper' && V?.phase === 'light' && !V.busy) {
    const x = +tile.dataset.x, y = +tile.dataset.y;
    aim = aim && aim.x === x && aim.y === y ? null : { x, y };
    return render();
  }
  const a = e.target.closest('[data-act]')?.dataset.act;
  if (!a || e.target.closest('[disabled]')) return;
  if (navigator.vibrate) navigator.vibrate(10);
  const [k, v] = a.split(':');
  if (k === 'start' || k === 'next' || k === 'retry') act({ a: k });
  else if (k === 'pick' && picks.length < SIGNALS_PER_TURN) picks.push(v);
  else if (k === 'unpick') picks.splice(+v, 1);
  else if (k === 'light') act({ a: 'light', beam: aim, signals: picks });
  else if (k === 'move' && plan.length < MOVES_PER_TURN) plan.push(v);
  else if (k === 'undo') plan.pop();
  else if (k === 'sail') act({ a: 'sail', plan });
  render();
});
addEventListener('resize', render);
</script>
</body>
</html>
