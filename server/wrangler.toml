# Co-op relay. Deploy with server/deploy.sh; run locally with `npm run dev` (in server/).
name = "coop-relay"
main = "worker.js"
compatibility_date = "2026-09-01"
account_id = "9c50cb0bfe1f658aef32f95eac275095"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://www.alecsharpie.me,https://alecsharpie.github.io,http://localhost:*,http://127.0.0.1:*"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# SQLite-backed class: the kind available on the Workers Free plan
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = false
