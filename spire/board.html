<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Co-op Spire · Board</title>
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="spire.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  body { display: grid; grid-template-rows: auto 1fr; overflow: hidden; }
  header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--bg-2); }
  header h1 { margin: 0; font-size: 22px; }
  header .sp { flex: 1; }
  .map { display: flex; gap: 6px; align-items: center; }
  .map span { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: var(--panel); border: 2px solid var(--line); font-size: 18px; opacity: .5; }
  .map span.done { opacity: .9; border-color: var(--good); }
  .map span.now { opacity: 1; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(255, 207, 90, .35); }
  main { display: grid; grid-template-columns: 300px 1fr 300px; gap: 20px; padding: 20px; min-height: 0; }
  .player { display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 18px; background: var(--bg-2); border: 1px solid var(--line); min-height: 0; }
  .player h2 { margin: 0; font-size: 22px; }
  .player .state { font-size: 18px; }
  .player .hint { font-size: 56px; text-align: center; min-height: 64px; }
  .player .played { display: flex; flex-direction: column; gap: 10px; overflow: auto; }
  .player .played .card { min-height: 0; cursor: default; }
  .player .played .ev { font-size: 15px; font-weight: 700; color: var(--ink); }
  .middle { display: flex; flex-direction: column; gap: 18px; align-items: center; min-height: 0; }
  .enemy { text-align: center; width: 100%; max-width: 560px; }
  .enemy .ico { font-size: 140px; line-height: 1.1; transition: transform .2s; }
  .enemy .ico.hurt { transform: scale(.9) rotate(-6deg); filter: brightness(1.6); }
  .enemy h2 { margin: 4px 0 10px; font-size: 30px; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .party { width: 100%; max-width: 560px; padding: 16px; border-radius: 18px; background: var(--bg-2); border: 1px solid var(--line); }
  .party .lbl { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 18px; }
  .log { color: var(--ink-2); font-size: 16px; line-height: 1.5; text-align: center; max-width: 560px; }
  .banner { font-size: 20px; text-align: center; padding: 12px 18px; border-radius: var(--radius); background: var(--panel); border: 2px solid var(--accent); }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 10, 20, .84); z-index: 10; padding: 24px; }
  .panel { max-width: 900px; text-align: center; padding: 32px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 24px; }
  .panel h2 { font-size: 38px; margin: 0 0 10px; }
  .panel p { font-size: 20px; color: var(--ink-2); }
  .panel .opts { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; margin: 18px 0; }
  .panel .opt { width: 240px; padding: 18px; border-radius: 18px; background: var(--panel); border: 2px solid var(--line); }
  .panel .opt .big { font-size: 54px; }
  .settings { position: fixed; right: 16px; bottom: 12px; display: flex; gap: 8px; z-index: 5; }
</style>
</head>
<body>
<header>
  <h1>🃏 Co-op Spire</h1>
  <div class="map" id="map"></div>
  <span class="sp"></span>
  <span class="chip" id="net"><span class="dot"></span><span>connecting</span></span>
  <span class="chip" id="room"></span>
</header>
<main>
  <div class="player" id="p-warden"></div>
  <div class="middle">
    <div class="banner" id="banner"></div>
    <div class="enemy" id="enemy"></div>
    <div class="party" id="party"></div>
    <div class="log" id="log"></div>
  </div>
  <div class="player" id="p-striker"></div>
</main>
<div class="settings">
  <button class="btn sm" id="mode"></button>
  <button class="btn sm" id="swap">Swap roles</button>
  <button class="btn sm" id="seats">Show join code</button>
  <button class="btn sm" id="abandon">New run</button>
</div>
<div class="overlay hidden" id="lobby"></div>
<div class="overlay hidden" id="stage"></div>

<script type="module">
import { hostRoom, load, save } from '../shared/net.js';
import { renderLobby, findLan } from '../shared/lobby.js';
import { newTurn, submit, withdraw, phaseOf, lockedIn } from '../shared/phases.js';
import { SEATS, PHASES, VOTE, partnerOf, newRun, resolve, validPick, describeIntent, chooseReward, chooseRelic, rest, advance, hint, REST, nodeOf } from './game.js';
import { CARDS, ENEMIES, RELICS, MAP, HINTS } from './cards.js';

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ROLES = {
  warden: { label: 'Warden', icon: '🛡️', blurb: 'support and control: block, weaken, mark the target' },
  striker: { label: 'Striker', icon: '⚔️', blurb: 'damage: attacks that hit harder with the right setup' },
};
const NODE_ICON = { fight: '⚔️', rest: '🔥', elite: '💀', boss: '🔔' };
const INTENT_ICON = { atk: '🗡️', block: '🛡️', buff: '💪', charge: '🔔' };

const room = hostRoom({ game: 'spire', seats: SEATS, onSeats: render, onAction, onStatus });
const KEY = `coop-spire-${room.room}`;
// the save: the run plus whatever the current phase has collected
let S = load(KEY) || { lobby: true, run: null, turn: newTurn(), reveal: null, mismatch: null, quiet: false };
let busy = false, shown = 0; // revealing the cards one event at a time
const persist = () => { if (!busy) save(KEY, S); };

$('room').textContent = 'Room ' + room.room;
await findLan();

function onStatus(st) {
  $('net').innerHTML = `<span class="dot${st === 'open' ? ' on' : ''}"></span><span>${st === 'open' ? (room.net === 'local' ? 'local tabs' : 'online') : st}</span>`;
}

const bothSeated = () => SEATS.every(s => room.seat(s));
const nameOf = seat => room.seat(seat)?.name || ROLES[seat].label;
function setRun(run) { S.run = run; S.turn = newTurn(); S.mismatch = null; persist(); render(); }

function onAction(seat, a) {
  if (!a || typeof a !== 'object' || busy) return;
  const r = S.run;
  if (a.a === 'start' && S.lobby && bothSeated()) { S.lobby = false; if (!r) S.run = newRun(); persist(); return render(); }
  if (S.lobby || !r) return;
  if (a.a === 'newrun' && ['won', 'lost'].includes(r.stage)) { S.reveal = null; return setRun(newRun()); }
  if (a.a === 'advance' && r.stage === 'map') { S.reveal = null; return setRun(advance(r)); }
  if (!seat) return;

  if (r.stage === 'fight') {
    if (a.a === 'hint' && HINTS.includes(a.emoji) && !r.hints[seat] && !(seat in S.turn.got)) { S.run = hint(r, seat, a.emoji); persist(); return render(); }
    if (a.a === 'unpick') { S.turn = withdraw(PHASES, S.turn, seat); persist(); return render(); }
    if (a.a === 'pick' && validPick(r, seat, a.idxs)) {
      const res = submit(PHASES, S.turn, seat, a.idxs);
      S.turn = res.turn;
      if (res.done) return reveal(r, res.done.moves);
      persist(); return render();
    }
  }
  const vote = (value, apply) => {
    const res = submit(VOTE, S.turn, seat, value);
    S.turn = res.turn; S.mismatch = null;
    if (res.done) {
      const m = res.done.moves;
      if (apply.agree && m.warden !== m.striker) { S.mismatch = m; S.turn = newTurn(); }
      else return setRun(apply(m));
    }
    persist(); render();
  };
  if (r.stage === 'reward' && a.a === 'reward' && (a.card === null || r.rewards[seat].includes(a.card))) vote(a.card, m => chooseReward(r, m));
  if (r.stage === 'relic' && a.a === 'relic' && r.relicChoices.includes(a.id)) vote(a.id, Object.assign(m => chooseRelic(r, m.warden), { agree: true }));
  if (r.stage === 'rest' && a.a === 'rest' && a.choice in REST) vote(a.choice, Object.assign(m => rest(r, m.warden), { agree: true }));
}

async function reveal(r, picks) {
  const played = Object.fromEntries(SEATS.map(seat => [seat, picks[seat].map(i => r.piles[seat].hand[i])]));
  const { state, events, mid } = resolve(r, picks);
  S.reveal = { played, events, turn: r.turn };
  busy = true; shown = 0; render();
  for (shown = 1; shown <= events.length; shown++) {
    // the bars move with the reveal: after the players' cards, then after the enemy
    const ev = events[shown - 1];
    if (ev.seat !== 'enemy' && shown === events.filter(x => x.seat !== 'enemy').length)
      S.run = { ...r, enemy: { ...r.enemy, hp: mid.enemyHp, block: mid.enemyBlock }, hp: mid.hp, block: mid.block };
    if (ev.seat === 'enemy') S.run = { ...state, stage: 'fight', turn: r.turn, enemy: { ...state.enemy, i: r.enemy.i } };
    render();
    if (events[shown - 1].seat !== 'enemy' && /damage/.test(events[shown - 1].text)) hurt();
    await new Promise(res => setTimeout(res, 750));
  }
  busy = false;
  setRun(state);
}
function hurt() { const i = document.querySelector('.enemy .ico'); if (!i) return; i.classList.add('hurt'); setTimeout(() => i.classList.remove('hurt'), 220); }

const cardHtml = (id, extra = '') => {
  const c = CARDS[id];
  return `<div class="card ${c.seat} ${extra}"><span class="cost">${c.cost}</span><div class="nm">${esc(c.name)}</div><div class="tx">${esc(c.text)}</div>${c.combo ? `<div class="cb">🤝 ${esc(c.combo.text)}</div>` : ''}${c.tags.length ? `<div class="tg">${c.tags.map(t => `<span>gives ${t}</span>`).join('')}</div>` : ''}</div>`;
};
const intentHtml = e => describeIntent(e).map(p => `<span>${INTENT_ICON[p.k]} ${esc(p.text)}</span>`).join('');

function render() {
  const r = S.run;
  $('mode').textContent = S.quiet ? 'Quiet: hints only' : 'Talk freely';
  $('lobby').classList.toggle('hidden', !S.lobby);
  if (S.lobby) renderLobby($('lobby'), {
    room: room.room, title: 'Co-op Spire',
    seats: SEATS.map(k => ({ ...ROLES[k], taken: !!room.seat(k), name: room.seat(k)?.name, connected: room.connected(k) })),
    startable: bothSeated(), startLabel: r ? `Resume floor ${r.floor + 1}` : 'Start a run',
  });
  if (!r) return sendViews();

  $('map').innerHTML = MAP.map((n, i) => `<span class="${i < r.floor ? 'done' : i === r.floor ? 'now' : ''}" title="${n.type}">${NODE_ICON[n.type]}</span>`).join('');
  const inFight = r.stage === 'fight' || busy;
  const locked = lockedIn(PHASES, S.turn);

  for (const seat of SEATS) {
    const rv = busy || (S.reveal && r.stage === 'fight' && S.reveal.turn === r.turn - 1) ? S.reveal : null;
    let evs = [];
    if (rv) { evs = rv.events.map((e, i) => ({ ...e, i })).filter(e => e.seat === seat && (!busy || e.i < shown)); }
    const state = !inFight ? '' : busy ? 'revealed' : locked[seat] ? '✅ Locked in' : '🤔 Choosing…';
    $('p-' + seat).innerHTML = `
      <h2>${ROLES[seat].icon} ${esc(nameOf(seat))}</h2>
      <div class="chip"><span class="dot${room.connected(seat) ? ' on' : ''}"></span>${ROLES[seat].label}</div>
      ${inFight ? `<div class="state">${state}</div>${!busy && r.hints?.[seat] ? `<div class="hint">${r.hints[seat]}</div>` : ''}` : ''}
      <div class="played">${evs.map(e => cardHtml(e.card, e.combo ? 'combo' : '') + `<div class="ev">${e.combo ? '🤝 COMBO · ' : ''}${esc(e.text)}</div>`).join('')}</div>`;
  }

  const e = r.enemy, info = e && ENEMIES[e.key];
  $('enemy').innerHTML = e && (inFight || r.stage !== 'rest') ? `
    <div class="intent" style="${inFight ? '' : 'visibility:hidden'}">${intentHtml(e)}</div>
    <div class="ico">${info.icon}</div><h2>${esc(info.name)}</h2>
    <div class="bar"><i style="width:${100 * e.hp / e.max}%"></i><b>${e.hp} / ${e.max}</b></div>
    <div class="row">${e.block ? `<span class="pill blk">🛡️ ${e.block}</span>` : ''}${e.vuln ? `<span class="pill vuln">🎯 Vulnerable ${e.vuln}</span>` : ''}${e.weak ? `<span class="pill weak">🌀 Weak ${e.weak}</span>` : ''}${e.str ? `<span class="pill str">💪 ${e.str}</span>` : ''}</div>` : '';
  $('party').innerHTML = `
    <div class="lbl"><b>The party</b><span>${r.block ? `<span class="pill blk">🛡️ ${r.block}</span> ` : ''}${r.str ? `<span class="pill str">💪 ${r.str}</span> ` : ''}${r.relics.map(x => `<span class="pill" title="${esc(RELICS[x].text)}">${RELICS[x].icon} ${esc(RELICS[x].name)}</span>`).join(' ')}</span></div>
    <div class="bar party"><i style="width:${100 * r.hp / r.maxHp}%"></i><b>${r.hp} / ${r.maxHp}</b></div>`;

  const enemyEv = S.reveal && (busy ? S.reveal.events.slice(0, shown) : S.reveal.events).filter(x => x.seat === 'enemy');
  $('log').innerHTML = (enemyEv || []).map(x => `<div>${esc(x.text)}</div>`).join('');
  $('banner').innerHTML = busy ? '🃏 Reveal!' : r.stage === 'fight'
    ? `Turn ${r.turn} · floor ${r.floor + 1} of ${MAP.length}. Pick your cards in secret.${S.quiet ? ' <b>Quiet:</b> hints only.' : ' Talk it through.'}`
    : `Floor ${r.floor + 1} of ${MAP.length}`;

  renderStage(r);
  sendViews();
}

function renderStage(r) {
  const el = $('stage'), show = !S.lobby && !busy && r.stage !== 'fight';
  el.classList.toggle('hidden', !show);
  if (!show) return;
  const voted = lockedIn(VOTE, S.turn), status = SEATS.map(s => `${ROLES[s].icon} ${esc(nameOf(s))}: ${voted[s] ? '✅ chosen' : '🤔 choosing'}`).join(' &nbsp; ');
  const clash = S.mismatch ? `<p style="color:var(--bad)">You picked different ones. Talk it over and choose together.</p>` : '';
  let h = '';
  if (r.stage === 'reward') h = `<h2>Victory!</h2><p>Each of you picks a card for your own deck on your phone (or skips).</p><p>${status}</p>`;
  else if (r.stage === 'relic') h = `<h2>A relic glints in the rubble</h2><p>Agree on one. Both choose the same on your phones.</p>
      <div class="opts">${r.relicChoices.map(id => `<div class="opt"><div class="big">${RELICS[id].icon}</div><h3>${esc(RELICS[id].name)}</h3><div>${esc(RELICS[id].text)}</div></div>`).join('')}</div>${clash}<p>${status}</p>`;
  else if (r.stage === 'rest') h = `<h2>🔥 A campfire</h2><p>Agree on one on your phones.</p><div class="opts">${Object.values(REST).map(t => `<div class="opt">${esc(t)}</div>`).join('')}</div>${clash}<p>${status}</p>`;
  else if (r.stage === 'map') {
    const next = MAP[r.floor + 1];
    h = `<h2>Floor ${r.floor + 1} cleared</h2><p><b>Good stopping point.</b> The run is saved; close the tab whenever you like.</p>
      <p>Next: ${NODE_ICON[next.type]} ${next.enemy ? esc(ENEMIES[next.enemy].name) : 'a campfire'}${next.type === 'elite' ? ' (elite: drops a relic)' : next.type === 'boss' ? ' (the boss)' : ''}</p>
      <div class="opts"><button class="btn go" data-act="advance">Climb on</button></div>`;
  } else if (r.stage === 'won') h = `<h2>🔔 You reached the top!</h2><p>${esc(r.why)}</p><p>Fill in the playtest rubric together.</p><div class="opts"><button class="btn go" data-act="newrun">New run</button></div>`;
  else if (r.stage === 'lost') h = `<h2>💀 The climb ends</h2><p>${esc(r.why)} You made it to floor ${r.floor + 1}.</p><div class="opts"><button class="btn go" data-act="newrun">New run</button></div>`;
  const html = `<div class="panel">${h}</div>`;
  if (el.innerHTML !== html) el.innerHTML = html;
}

// What each phone may know: its own hand, never the partner's picks before the reveal.
function sendViews() {
  const r = S.run;
  for (const seat of SEATS) {
    const v = { seat, lobby: S.lobby, canStart: S.lobby && bothSeated(), started: !!r, quiet: S.quiet, busy, partner: nameOf(partnerOf(seat)) };
    if (r) {
      const phases = r.stage === 'fight' ? PHASES : VOTE;
      Object.assign(v, {
        stage: r.stage, floor: r.floor, floors: MAP.length, turn: r.turn, why: r.why,
        hp: r.hp, maxHp: r.maxHp, block: r.block, str: r.str,
        enemy: r.enemy && { name: ENEMIES[r.enemy.key].name, icon: ENEMIES[r.enemy.key].icon, hp: r.enemy.hp, max: r.enemy.max, block: r.enemy.block, vuln: r.enemy.vuln, weak: r.enemy.weak, intent: describeIntent(r.enemy) },
        locked: lockedIn(phases, S.turn), mine: S.turn.got[seat] ?? null, mismatch: !!S.mismatch,
        energy: r.energy?.[seat], hand: r.stage === 'fight' ? r.piles[seat].hand : [],
        myHint: r.hints?.[seat] || null, partnerHint: r.hints?.[partnerOf(seat)] || null,
        rewards: r.rewards?.[seat] || null, relicChoices: r.relicChoices,
        reveal: S.reveal && (busy ? { ...S.reveal, events: S.reveal.events.slice(0, shown) } : S.reveal),
        nextFloor: r.stage === 'map' ? MAP[r.floor + 1] : null,
      });
    }
    room.send(seat, v);
  }
}

document.body.addEventListener('click', e => {
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act) onAction(null, { a: act });
});
$('mode').onclick = () => { S.quiet = !S.quiet; persist(); render(); };
$('swap').onclick = () => { room.swap('warden', 'striker'); render(); };
$('seats').onclick = () => { S.lobby = true; persist(); render(); };
$('abandon').onclick = () => { if (!busy && confirmNew()) { S.reveal = null; setRun(newRun()); } };
// a second press within 3 s confirms, so a stray tap does not throw the run away (no browser dialogs)
let armed = 0;
function confirmNew() {
  if (Date.now() - armed < 3000) return true;
  armed = Date.now(); $('abandon').textContent = 'Press again to restart';
  setTimeout(() => $('abandon').textContent = 'New run', 3000);
  return false;
}
render();
</script>
</body>
</html>
